<!doctype html>
<html>
  <head>
    <title>Lead Scraper</title>
    <style>
      body {
        font-family: Arial;
        width: 340px;
        padding: 10px;
      }
      label {
        font-weight: bold;
        display: block;
        margin-top: 8px;
      }
      textarea {
        width: 100%;
        height: 60px;
        margin-top: 4px;
      }
      button {
        width: 100%;
        padding: 8px;
        margin-top: 8px;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h3>Lead Scraper</h3>

    <label>Store</label>
    <textarea id="store"></textarea>

    <label>Website</label>
    <textarea id="website"></textarea>

    <label>Emails</label>
    <textarea id="emails"></textarea>

    <button id="grab">Grab & Save</button>
    <button id="copy">Copy</button>

    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
